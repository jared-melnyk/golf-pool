# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# db/schema.rb is generated by Rails; it uses compact index arrays (`t.index ["a"]`)
# while Omakase expects spaces (`t.index [ "a" ]`). Exclude so `db:migrate` does not
# create endless RuboCop churn; hand-written Ruby still follows Omakase.
Layout/SpaceInsideArrayLiteralBrackets:
  Exclude:
    - db/schema.rb
